services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      USE_MOCK_LLM: ${USE_MOCK_LLM:-true}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      VISION_MODEL: ${VISION_MODEL:-gemma4:31b-cloud}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-30}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
